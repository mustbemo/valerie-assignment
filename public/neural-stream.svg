<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">Neural data stream</title>
  <desc id="desc">Glowing blue data paths and nodes flowing through a dark network.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#041325"/><stop offset=".52" stop-color="#062b4b"/><stop offset="1" stop-color="#020914"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0a62a4"/><stop offset=".45" stop-color="#42c7ff"/><stop offset="1" stop-color="#89e5ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="900" fill="url(#base)"/>
