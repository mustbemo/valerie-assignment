<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Protected digital core</title>
  <desc id="desc">A glowing secure core surrounded by encrypted data rings and a dark violet grid.</desc>
  <defs>
    <radialGradient id="backdrop" cx="50%" cy="44%" r="72%">
      <stop offset="0" stop-color="#29104d"/>
      <stop offset=".48" stop-color="#100b2c"/>
      <stop offset="1" stop-color="#050617"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="40%" r="60%">
      <stop stop-color="#ffffff"/>
      <stop offset=".2" stop-color="#efb7ff"/>
      <stop offset=".62" stop-color="#d14bff"/>
      <stop offset="1" stop-color="#7124b8"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#80e7ff"/>
      <stop offset=".48" stop-color="#d14bff"/>
      <stop offset="1" stop-color="#ff9bd7"/>
    </linearGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#8f72c8" stroke-opacity=".12"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="600" fill="url(#backdrop)"/>
  <rect width="900" height="600" fill="url(#grid)"/>
  <g fill="none" stroke="url(#ring)" stroke-linecap="round" transform="translate(450 300)">
    <circle r="202" stroke-width="2" stroke-dasharray="190 38" opacity=".28"/>
    <circle r="156" stroke-width="3" stroke-dasharray="92 26" opacity=".48" transform="rotate(21)"/>
    <circle r="112" stroke-width="4" stroke-dasharray="56 18" opacity=".72" transform="rotate(-17)"/>
  </g>
  <g fill="#dff9ff" filter="url(#glow)">
    <circle cx="450" cy="78" r="5"/>
    <circle cx="632" cy="184" r="4"/>
    <circle cx="663" cy="382" r="6"/>
    <circle cx="450" cy="522" r="5"/>
    <circle cx="254" cy="406" r="4"/>
    <circle cx="278" cy="170" r="6"/>
  </g>
  <path d="M450 210l78 30v55c0 67-31 108-78 135-47-27-78-68-78-135v-55l78-30z" fill="#13082c" stroke="url(#ring)" stroke-width="7"/>
  <circle cx="450" cy="305" r="44" fill="url(#core)" filter="url(#glow)"/>
  <path d="M431 302v-16c0-27 38-27 38 0v16m-47 0h56v51h-56z" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
